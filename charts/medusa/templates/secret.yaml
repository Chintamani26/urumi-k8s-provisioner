{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medusa.fullname" . }}-secrets
  labels:
    {{- include "medusa.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.postgresPassword }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.dbPassword }}
  db-password: {{ .Values.secrets.dbPassword | b64enc | quote }}
  {{- else }}
  db-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.cookieSecret }}
  cookie-secret: {{ .Values.secrets.cookieSecret | b64enc | quote }}
  {{- else }}
  cookie-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  admin-password: {{ randAlphaNum 16 | b64enc | quote }}
{{- end }}
