# Production values (for k3s/VPS)
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: medusa.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: medusa-tls
      hosts:
        - medusa.example.com

# Production storage (adjust storageClassName for your provider)
persistence:
  storageClassName: "local-path"  # For k3s, adjust for your provider
  size: 10Gi

database:
  persistence:
    storageClassName: "local-path"  # For k3s, adjust for your provider
    size: 20Gi

# Production resources
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

database:
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Production health checks
healthCheck:
  enabled: true
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
