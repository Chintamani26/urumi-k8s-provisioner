# Default values for medusa
# This is a YAML-formatted file.

replicaCount: 1

# MedusaJS Image
image:
  repository: medusajs/medusa
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Service Configuration
service:
  type: ClusterIP
  port: 9000
  targetPort: 9000

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: medusa.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Medusa Persistence
persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessMode: ReadWriteOnce

# Database Configuration
database:
  enabled: true
  type: postgresql
  image:
    repository: postgres
    tag: "15"
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  postgresPassword: ""  # Will be generated if empty
  database: medusa
  user: medusa
  password: ""  # Will be generated if empty
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Medusa Environment Variables
medusa:
  databaseUrl: ""  # Auto-generated from database config
  redisUrl: ""  # Optional, for production
  jwtSecret: ""  # Auto-generated
  cookieSecret: ""  # Auto-generated
  adminEmail: admin@example.com
  adminPassword: ""  # Auto-generated

# Redis Configuration (optional, for production)
redis:
  enabled: false
  image:
    repository: redis
    tag: "7-alpine"

# Secrets Configuration
secrets:
  create: true
  # If empty, passwords will be auto-generated
  postgresPassword: ""
  dbPassword: ""
  jwtSecret: ""
  cookieSecret: ""

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Network Policy Configuration
networkPolicy:
  enabled: true
  ingressController:
    namespace: ingress-nginx
    labels:
      app.kubernetes.io/name: ingress-nginx

# Resource Quota Configuration
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    persistentvolumeclaims: "3"
    requests.storage: "10Gi"
    limits.storage: "20Gi"

# LimitRange Configuration (default requests/limits for pods)
limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "512Mi"
  defaultRequest:
    cpu: "250m"
    memory: "256Mi"
  max:
    cpu: "2"
    memory: "2Gi"
  min:
    cpu: "100m"
    memory: "128Mi"
  maxStorage: "10Gi"

# Health Checks
healthCheck:
  enabled: true
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
