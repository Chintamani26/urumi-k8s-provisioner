{{- if .Values.database.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "woocommerce.fullname" . }}-setup
  labels:
    {{- include "woocommerce.labels" . | nindent 4 }}
    app.kubernetes.io/component: setup
spec:
  template:
    metadata:
      labels:
        {{- include "woocommerce.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: woocommerce-setup
          image: wordpress:cli
          command:
            - sh
            - -c
            - |
              echo "Waiting for WordPress to be ready..."
              SERVICE_NAME="{{ include "woocommerce.fullname" . }}"
              until curl -f http://${SERVICE_NAME}:80 > /dev/null 2>&1 || nc -z ${SERVICE_NAME} 80; do
                echo "WordPress is unavailable - sleeping"
                sleep 5
              done
              echo "WordPress is ready!"
              echo "Note: WooCommerce plugin installation should be done via WordPress admin after initial setup"
              echo "Setup job complete!"
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ .Values.wordpress.dbHost | default (printf "%s-mysql" (include "woocommerce.fullname" .)) | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.wordpress.dbUser | default .Values.database.user | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce.fullname" . }}-secrets
                  key: db-password
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.wordpress.dbName | default .Values.database.database | quote }}
      backoffLimit: 3
{{- end }}
